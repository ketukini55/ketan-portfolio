<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mango Orange Themed Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffec40; /* Mango Background */
            color: #e65100; /* Orange Text */
        }
        header {
            background-color: #ff9800; /* Darker Orange */
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        section {
            margin: 20px;
            padding: 10px;
            background-color: rgba(255, 236, 64, 0.8);
            border-radius: 8px;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #ff9800;
            color: white;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        .portfolio-item {
            border: 1px solid #ff5722; /* Light Orange */
            border-radius: 5px;
            margin: 10px;
            padding: 10px;
            background-color: #fff3e0; /* Light Mango */
            transition: transform 0.2s;
        }
        .portfolio-item:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header>
        <h1>Mango Orange Themed Portfolio</h1>
    </header>
    <section>
        <h2>About Me</h2>
        <p>Hello! I am passionate about web development and design. Welcome to my portfolio.</p>
    </section>
    <section>
        <h2>My Projects</h2>
        <div class="portfolio-item">
            <h3>Project 1</h3>
            <p>Description of project 1.</p>
        </div>
        <div class="portfolio-item">
            <h3>Project 2</h3>
            <p>Description of project 2.</p>
        </div>
        <div class="portfolio-item">
            <h3>Project 3</h3>
            <p>Description of project 3.</p>
        </div>
    </section>
    <footer>
        <p>&copy; 2026 Mango Orange Portfolio</p>
    </footer>
</body>
</html>
